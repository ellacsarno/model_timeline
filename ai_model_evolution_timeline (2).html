                  <div className="flex items-center gap-2">
                    <span className="p-1.5 bg-emerald-50 text-emerald-600 rounded-lg">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                      </svg>
                    </span>
                    <h2 className="text-xl font-extrabold text-slate-900">Frontier Flagships vs. Leading Lightweight Models</h2>
                  </div>
                  <p className="text-xs text-slate-500 mt-1">
                    Comparing API token cost (log scale) against scientific reasoning scores.
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-3">
                  <div className="flex items-center bg-slate-100 p-1 rounded-lg text-xs font-semibold">
                    <button
                      onClick={() => setCostMetric('input')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        costMetric === 'input' ? 'bg-white text-emerald-700 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Input $/1M
                    </button>
                    <button
                      onClick={() => setCostMetric('output')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        costMetric === 'output' ? 'bg-white text-emerald-700 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Output $/1M
                    </button>
                    <button
                      onClick={() => setCostMetric('blended')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        costMetric === 'blended' ? 'bg-white text-emerald-700 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Blended (3:1)
                    </button>
                  </div>

                  <div className="flex items-center bg-indigo-50 border border-indigo-150 p-1 rounded-lg text-xs font-semibold">
                    <button
                      onClick={() => setScatterBenchmark('hle')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        scatterBenchmark === 'hle' ? 'bg-indigo-600 text-white shadow-sm font-bold' : 'text-indigo-900 hover:text-indigo-700'
                      }`}
                    >
                      Humanity&apos;s Last Exam (HLE)
                    </button>
                    <button
                      onClick={() => setScatterBenchmark('gpqa')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        scatterBenchmark === 'gpqa' ? 'bg-indigo-600 text-white shadow-sm font-bold' : 'text-indigo-900 hover:text-indigo-700'
                      }`}
                    >
                      GPQA Diamond
                    </button>
                    <button
                      onClick={() => setScatterBenchmark('frontierMath')}
                      className={`px-2.5 py-1 rounded-md transition-all ${
                        scatterBenchmark === 'frontierMath' ? 'bg-indigo-600 text-white shadow-sm font-bold' : 'text-indigo-900 hover:text-indigo-700'
                      }`}
                    >
                      FrontierMath
                    </button>
                  </div>
                </div>
              </div>

              <div className="relative w-full overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm p-2 md:p-5">
                <div className="min-w-[780px]">
                  <svg viewBox={`0 0 ${sWidth} ${sHeight}`} className="w-full h-auto">
                    <rect
                      x={sPadding.left}
                      y={sPadding.top}
                      width={sInnerWidth * 0.45}
                      height={sInnerHeight * 0.55}
                      fill="#f0fdf4"
                      opacity="0.65"
                      rx="8"
                    />
                    <text
                      x={sPadding.left + 14}
                      y={sPadding.top + 22}
                      fill="#15803d"
                      fontSize="11"
                      fontWeight="bold"
                      className="select-none tracking-wider uppercase opacity-85"
                    >
                      High Efficiency Sweet Spot (Top ROI)
                    </text>

                    {currentYConfig.ticks.map((tickVal) => {
                      const y = getScatterY(tickVal);
                      return (
                        <g key={`y-grid-${tickVal}`}>
                          <line
                            x1={sPadding.left}
                            y1={y}
                            x2={sWidth - sPadding.right}
                            y2={y}
                            stroke="#f1f5f9"
                            strokeDasharray="3 3"
                            strokeWidth="1"
                          />
                          <text
                            x={sPadding.left - 12}
                            y={y + 4}
                            textAnchor="end"
                            fontSize="11"
                            fill="#64748b"
                            fontFamily="monospace"
                            className="font-medium"
                          >
                            {tickVal}%
                          </text>
                        </g>
                      );
                    })}

                    {activeDomain.ticks.map((tickVal) => {
                      const x = getScatterX(tickVal);
                      if (x < sPadding.left || x > sWidth - sPadding.right) return null;
                      return (
                        <g key={`x-grid-${tickVal}`}>
                          <line
                            x1={x}
                            y1={sPadding.top}
                            x2={x}
                            y2={sHeight - sPadding.bottom}
                            stroke="#f1f5f9"
                            strokeDasharray="3 3"
                            strokeWidth="1"
                          />
                          <line
                            x1={x}
                            y1={sHeight - sPadding.bottom}
                            x2={x}
                            y2={sHeight - sPadding.bottom + 5}
                            stroke="#94a3b8"
                            strokeWidth="1.5"
                          />
                          <text
                            x={x}
                            y={sHeight - sPadding.bottom + 18}
                            textAnchor="middle"
                            fontSize="10"
                            fill="#64748b"
                            fontFamily="monospace"
                            className="font-medium"
                          >
                            ${tickVal >= 1 ? tickVal.toFixed(2) : tickVal.toFixed(2)}
                          </text>
                        </g>
                      );
                    })}

                    <line
                      x1={sPadding.left}
                      y1={sHeight - sPadding.bottom}
                      x2={sWidth - sPadding.right}
                      y2={sHeight - sPadding.bottom}
                      stroke="#94a3b8"
                      strokeWidth="1.5"
                    />
                    <line
                      x1={sPadding.left}
                      y1={sPadding.top}
                      x2={sPadding.left}
                      y2={sHeight - sPadding.bottom}
                      stroke="#94a3b8"
                      strokeWidth="1.5"
                    />

                    <text
                      x={sPadding.left + sInnerWidth / 2}
                      y={sHeight - 16}
                      textAnchor="middle"
                      fontSize="12"
                      fontWeight="bold"
                      fill="#334155"
                    >
                      Token Rate: {costMetric === 'input' ? 'Input Cost per 1M Tokens ($)' : costMetric === 'output' ? 'Output Cost per 1M Tokens ($)' : 'Blended Cost per 1M Tokens ($)'} (Logarithmic Scale)
                    </text>

                    {/* Properly closed text tag for the vertical axis label */}
                    <text
                      x={-(sPadding.top + sInnerHeight / 2)}
                      y={24}
                      textAnchor="middle"
                      transform="rotate(-90)"
                      fontSize="12"
                      fontWeight="bold"
                      fill="#334155"
                    >
                      {currentYConfig.label}
                    </text>

                    {}
                    {costScoreModels.map((m) => {
                      const cost = getModelCost(m);
                      const score = m.scores[scatterBenchmark];
                      const cx = getScatterX(cost);
                      const cy = getScatterY(score);
                      const isHovered = hoveredScatterModel?.name === m.name;
                      const isApex = m.tier.includes('Apex');
                      const radius = isHovered ? 11 : isApex ? 8.5 : 6.5;
                      const pointColor = colors[m.company];

                      // Dynamic label offset depending on position to eliminate collisions
                      const isRightSide = cx > sPadding.left + sInnerWidth * 0.72;
                      const isTopSide = cy < sPadding.top + sInnerHeight * 0.3;
                      const labelDx = isRightSide ? -14 : 14;
                      const labelDy = isTopSide ? 16 : -8;
                      const textAnchor = isRightSide ? 'end' : 'start';

                      return (
                        <g key={`scatter-pt-${m.name}`} className="cursor-pointer">
                          {isHovered && (
                            <circle
                              cx={cx}
                              cy={cy}
                              r={radius + 8}
                              fill={pointColor}
                              opacity="0.25"
                              className="transition-all duration-300 ease-out"
                            />
                          )}

                          {isApex && (
                            <rect
                              x={cx - (radius + 2.5)}
                              y={cy - (radius + 2.5)}
                              width={(radius + 2.5) * 2}
                              height={(radius + 2.5) * 2}
                              transform={`rotate(45, ${cx}, ${cy})`}
                              fill="none"
                              stroke={pointColor}
                              strokeWidth="1.5"
                              strokeDasharray="2 2"
                              opacity="0.75"
                              className="transition-all duration-300 ease-out"
                            />
                          )}

                          <circle
                            cx={cx}
                            cy={cy}
                            r={radius}
                            fill={pointColor}
                            stroke="#ffffff"
                            strokeWidth={isApex ? '2.5' : '1.5'}
                            onMouseEnter={() => setHoveredScatterModel({ ...m, cx, cy, cost, score })}
                            onMouseLeave={() => setHoveredScatterModel(null)}
                            className="transition-all duration-300 ease-out"
                          />

                          <text
                            x={cx + labelDx}
                            y={cy + labelDy}
                            textAnchor={textAnchor}
                            fill="#1e293b"
                            fontSize="11"
                            fontWeight={isApex ? 'bold' : '600'}
                            stroke="#ffffff"
                            strokeWidth="3.5"
                            paintOrder="stroke fill"
                            strokeLinejoin="round"
                            className="pointer-events-none select-none transition-all duration-300 ease-out"
                          >
                            {m.name} <tspan fill="#64748b" fontSize="9" fontWeight="500">({isApex ? 'Apex' : 'Light'})</tspan>
                          </text>
                        </g>
                      );
                    })}
                  </svg>

                  {hoveredScatterModel && (
                    <div
                      className="absolute z-20 bg-slate-900/95 backdrop-blur text-white text-xs px-4 py-3 rounded-xl shadow-xl pointer-events-none transform -translate-x-1/2 -translate-y-full mt-[-12px] border border-slate-700 min-w-[210px]"
                      style={{
                        left: `${(hoveredScatterModel.cx / sWidth) * 100}%`,
                        top: `${(hoveredScatterModel.cy / sHeight) * 100}%`
                      }}
                    >
                      <div className="flex items-center justify-between gap-2 border-b border-slate-700/80 pb-1.5 mb-2">
                        <span className="font-extrabold text-sm" style={{ color: colors[hoveredScatterModel.company] }}>
                          {hoveredScatterModel.name}
                        </span>
                        <span className="text-[9px] uppercase px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-bold">
                          {hoveredScatterModel.company}
                        </span>
                      </div>

                      <div className="space-y-1 font-mono text-[11px]">
                        <div className="flex justify-between">
                          <span className="text-slate-400">Score ({scatterBenchmark.toUpperCase()}):</span>
                          <span className="font-bold text-white">{hoveredScatterModel.score.toFixed(1)}%</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Input Rate:</span>
                          <span className="font-bold text-emerald-400">${hoveredScatterModel.inputCost.toFixed(2)} / 1M</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Output Rate:</span>
                          <span className="font-bold text-emerald-400">${hoveredScatterModel.outputCost.toFixed(2)} / 1M</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Context Window:</span>
                          <span className="text-slate-300">{hoveredScatterModel.context}</span>
                        </div>
                        <div className="flex justify-between pt-1 border-t border-slate-800 text-[10px]">
                          <span className="text-indigo-300">Value Efficiency:</span>
                          <span className="font-bold text-indigo-300">
                            {(hoveredScatterModel.score / Math.max(0.2, hoveredScatterModel.cost)).toFixed(1)} pts / $
                          </span>
                        </div>
                      </div>

                      <div className="absolute w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[6px] border-t-slate-900 left-1/2 bottom-[-6px] transform -translate-x-1/2" />
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {}
          {activeTab === 'pricing' && (
            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
              <div className="flex flex-col md:flex-row md:items-center justify-between pb-5 border-b border-slate-100 gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="p-1.5 bg-indigo-50 rounded-lg text-indigo-600">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                    </span>
                    <h2 className="text-xl font-bold text-slate-900">Apex Flagship Token Economics & Pricing</h2>
                  </div>
                  <p className="text-sm text-slate-500 mt-1">
                    Comparing API token costs per million tokens, prompt caching discounts, and context windows.
                  </p>
                </div>

                <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg text-xs font-semibold self-start md:self-auto">
                  {Object.keys(scenarios).map((key) => (
                    <button
                      key={key}
                      onClick={() => setPricingScenario(key)}
                      className={`px-3 py-1.5 rounded-md transition-all ${
                        pricingScenario === key ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      {scenarios[key].title}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mt-6">
                {Object.entries(flagshipPricing).map(([company, info]) => {
                  const maxOutput = 50.0;
                  const outputWidth = (info.outputPerM / maxOutput) * 100;
                  const inputWidth = (info.inputPerM / maxOutput) * 100;
                  const scenarioCost = calculateScenarioCost(company, pricingScenario);

                  return (
                    <div
                      key={`pricing-${company}`}
                      className="bg-slate-50 rounded-xl p-5 border border-slate-200/80 hover:border-slate-300 transition-all flex flex-col justify-between"
                    >
                      <div>
                        <div className="flex justify-between items-start mb-2">
                          <div>
                            <span className="text-xs font-bold tracking-wider uppercase text-slate-400">{company}</span>
                            <h3 className="text-lg font-extrabold text-slate-900" style={{ color: info.color }}>
                              {info.model}
                            </h3>
                          </div>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200/70 text-slate-700">
                            {info.badge}
                          </span>
                        </div>

                        <div className="flex items-center gap-2 mb-4 text-xs font-medium text-slate-600">
                          <span className="inline-flex items-center gap-1 bg-white px-2 py-0.5 rounded border border-slate-200">
                            <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7c0-2-1-3-3-3H7C5 4 4 5 4 7z" />
                            </svg>
                            {info.contextWindow}
                          </span>
                        </div>

                        <div className="grid grid-cols-3 gap-2 bg-white p-3 rounded-lg border border-slate-150 shadow-2xs mb-4 text-center">
                          <div>
                            <div className="text-[10px] text-slate-400 font-semibold uppercase">Input</div>
                            <div className="text-sm font-black text-slate-800">${info.inputPerM.toFixed(2)}</div>
                            <div className="text-[9px] text-slate-400">/ 1M</div>
                          </div>
                          <div className="border-x border-slate-100">
                            <div className="text-[10px] text-emerald-600 font-semibold uppercase">Cached</div>
                            <div className="text-sm font-black text-emerald-700">${info.cachedInputPerM.toFixed(2)}</div>
                            <div className="text-[9px] text-slate-400">/ 1M</div>
                          </div>
                          <div>
                            <div className="text-[10px] text-slate-400 font-semibold uppercase">Output</div>
                            <div className="text-sm font-black text-slate-800">${info.outputPerM.toFixed(2)}</div>
                            <div className="text-[9px] text-slate-400">/ 1M</div>
                          </div>
                        </div>

                        <div className="space-y-2 mb-4">
                          <div>
                            <div className="flex justify-between text-[11px] font-medium text-slate-500 mb-1">
                              <span>Input Rate</span>
                              <span>${info.inputPerM.toFixed(2)} / 1M</span>
                            </div>
                            <div className="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                              <div className="h-1.5 rounded-full" style={{ width: `${inputWidth}%`, backgroundColor: info.color }} />
                            </div>
                          </div>

                          <div>
                            <div className="flex justify-between text-[11px] font-medium text-slate-500 mb-1">
                              <span>Output Rate</span>
                              <span>${info.outputPerM.toFixed(2)} / 1M</span>
                            </div>
                            <div className="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                              <div className="h-1.5 rounded-full" style={{ width: `${outputWidth}%`, backgroundColor: info.color }} />
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white p-3 rounded-lg border border-slate-200/90 mt-2">
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-medium text-slate-500">Estimated Query Cost:</span>
                          <span className="text-base font-extrabold text-slate-900">${scenarioCost}</span>
                        </div>
                        <div className="text-[10px] text-slate-400 mt-0.5 text-right font-mono">
                          {scenarios[pricingScenario].title}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="mt-5 p-3.5 bg-indigo-50/60 rounded-xl border border-indigo-100 flex flex-col md:flex-row md:items-center justify-between text-xs text-indigo-900 gap-2">
                <div className="flex items-center gap-2">
                  <span className="font-bold flex items-center gap-1">
                    <svg className="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Key Takeaway:
                  </span>
                  <span>
                    <strong>Gemini 4 Argon</strong> provides the lowest apex frontier rates ($2.00/M in, $10.00/M out) with a 4M window, while{' '}
                    <strong>Claude Opus 5.5</strong> delivers top HLE reasoning at $4.00/$20.00 ($0.20 cached), and <strong>GPT-6 Astra</strong> occupies the premium research tier at $10.00/$50.00.
                  </span>
                </div>
                <div className="text-[11px] text-indigo-700 shrink-0 font-medium">
                  *Standardized per 1,000,000 tokens (USD).
                </div>
              </div>
            </div>
          )}

          {}
          <footer className="mt-6 text-xs text-slate-500 px-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-t border-slate-200/60 pt-4">
            <div>
              * <strong>Historical Context:</strong> GPT-4.5 was deployed in Feb 2025 prior to the optimized GPT-4.1 series.
            </div>
            <div className="text-[11px] text-slate-400">
              Evaluations based on official technical papers & research consortium submissions.
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AIModelChart />);
  </script>
</body>
</html>
